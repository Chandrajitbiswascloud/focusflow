<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080B11" />
    </radialGradient>
    
    <!-- Neon Border Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring with neon border -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Glowing Letter F -->
  <text x="256" y="325" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="bold" 
        font-size="200" 
        fill="#10B981" 
        text-anchor="middle"
        filter="url(#glow)">
    F
  </text>
</svg>
